<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>食通グルメマップ</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
  :root { --bg: #1c1917; --panel: #292524; --ink: #fafaf9; --muted: #a8a29e; --accent: #ea580c; --accent2: #fbbf24; --chip: #44403c; --chip-on: #ea580c; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif; background: var(--bg); color: var(--ink); }
  #app { display: flex; flex-direction: column; height: 100%; height: 100dvh; }
  header { flex: 0 0 auto; padding: 10px 14px 6px; background: var(--bg); }
  header h1 { margin: 0; font-size: 16px; font-weight: 700; letter-spacing: .02em; }
  header p { margin: 2px 0 0; font-size: 11px; color: var(--muted); }
  #count { color: var(--accent2); font-weight: 700; }
  #toolbar { flex: 0 0 auto; padding: 0 12px 8px; background: var(--bg); display: flex; gap: 8px; align-items: center; }
  #q { flex: 1; min-width: 0; appearance: none; border: 0; border-radius: 10px; background: var(--panel); color: var(--ink); font-size: 14px; padding: 10px 12px; }
  #near, #toggle { appearance: none; border: 0; border-radius: 10px; background: var(--chip); color: #fff; font-size: 12px; font-weight: 700; padding: 10px 10px; white-space: nowrap; }
  #near.on, #toggle.on { background: var(--accent); }
  #filters { flex: 0 0 auto; padding: 0 12px 8px; background: var(--bg); display: none; max-height: 42vh; overflow: auto; }
  #filters.open { display: block; }
  .row { margin-top: 6px; }
  .label { font-size: 10px; color: var(--muted); margin-bottom: 4px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { appearance: none; border: 0; border-radius: 999px; background: var(--chip); color: var(--ink); font-size: 12px; padding: 6px 10px; line-height: 1.2; font-weight: 600; }
  .chip.on { background: var(--chip-on); color: #fff; }
  #map { flex: 1 1 auto; width: 100%; min-height: 200px; }
  .leaflet-popup-content-wrapper { border-radius: 12px; }
  .leaflet-popup-content { margin: 12px 14px; min-width: 210px; max-width: 280px; }
  .pop h2 { margin: 0 0 4px; font-size: 16px; line-height: 1.3; }
  .pop .star { color: #c2410c; font-size: 12px; font-weight: 700; margin: 0 0 4px; }
  .pop .meta { font-size: 12px; color: #444; margin: 0 0 6px; }
  .pop .oshi { font-size: 13px; font-weight: 700; margin: 0 0 4px; }
  .pop .memo { font-size: 13px; line-height: 1.5; margin: 0 0 10px; }
  .pop .btns { display: flex; flex-direction: column; gap: 6px; }
  .pop a.btn { display: block; text-align: center; text-decoration: none; background: #ea580c; color: #fff; border-radius: 8px; padding: 8px 10px; font-size: 13px; font-weight: 700; }
  .pop a.btn.sub { background: #1c1917; }
  .legend { position: absolute; right: 10px; bottom: 22px; z-index: 500; background: rgba(28,25,23,.9); color: #fff; font-size: 11px; padding: 6px 8px; border-radius: 8px; pointer-events: none; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>食通グルメマップ</h1>
    <p>最初は <b>8,000円以内</b> の店だけ表示。<span id="count"></span></p>
  </header>
  <div id="toolbar">
    <input id="q" type="search" placeholder="メニュー・店名で検索（例：もつ鍋）" enterkeyhint="search" />
    <button type="button" id="near">現在地の近く</button>
    <button type="button" id="toggle">絞り込み</button>
  </div>
  <div id="filters">
    <div class="row"><div class="label">予算</div><div class="chips" id="budget-chips"></div></div>
    <div class="row"><div class="label">発信者</div><div class="chips" id="foodie-chips"></div></div>
    <div class="row"><div class="label">ジャンル</div><div class="chips" id="genre-chips"></div></div>
    <div class="row"><div class="label">都道府県</div><div class="chips" id="pref-chips"></div></div>
  </div>
  <div id="map"></div>
  <div class="legend">
    <div><span class="dot" style="background:#16a34a"></span>〜5000円</div>
    <div><span class="dot" style="background:#2563eb"></span>5000〜8000円</div>
    <div><span class="dot" style="background:#a8a29e"></span>8000円超／不明</div>
  </div>
</div>

  { id: "unk", label: "不明", match: (b) => b === "不明" }
];
const COLORS = { "〜5000円": "#16a34a", "5000〜8000円": "#2563eb", "8000円超": "#a8a29e", "不明": "#a8a29e" };
const state = { budgets: new Set(["in8"]), foodie: "all", genre: "all", pref: "all", q: "", near: null, nearby: false };

function unique(key) {
  return [...new Set(SHOPS.map(s => s[key]).filter(Boolean))].sort((a,b) => a.localeCompare(b, "ja"));
}
function makeChips(el, items, onPick) {
  el.innerHTML = "";
  items.forEach(item => {
    const btn = document.createElement("button");
    btn.className = "chip" + (item.on ? " on" : "");
    btn.type = "button";
    btn.textContent = item.label;
    btn.addEventListener("click", () => onPick(item.id));
    el.appendChild(btn);
  });
}
function renderFilterChips() {
  makeChips(document.getElementById("budget-chips"),
    BUDGETS.map(b => ({ id: b.id, label: b.label, on: state.budgets.has(b.id) })),
    (id) => {
      if (id === "in8") {
        state.budgets = new Set(["in8"]);
      } else {
        state.budgets.delete("in8");
        if (state.budgets.has(id)) {
          if (state.budgets.size > 1) state.budgets.delete(id);
        } else {
          state.budgets.add(id);
        }
        if (!state.budgets.size) state.budgets.add("in8");
      }
      renderFilterChips(); applyFilter();
    }
  );
  makeChips(document.getElementById("foodie-chips"),
    ["all", ...unique("食通")].map(v => ({ id: v, label: v === "all" ? "全員" : v, on: state.foodie === v })),
    (id) => { state.foodie = id; renderFilterChips(); applyFilter(); }
  );
  makeChips(document.getElementById("genre-chips"),
    ["all", ...unique("ジャンル")].map(v => ({ id: v, label: v === "all" ? "すべて" : v, on: state.genre === v })),
    (id) => { state.genre = id; renderFilterChips(); applyFilter(); }
  );
  makeChips(document.getElementById("pref-chips"),
    ["all", ...unique("都道府県")].map(v => ({ id: v, label: v === "all" ? "すべて" : v, on: state.pref === v })),
    (id) => { state.pref = id; renderFilterChips(); applyFilter(); }
  );
}
function budgetOK(band) {
  return BUDGETS.filter(b => state.budgets.has(b.id)).some(b => b.match(band));
}
function hay(s) {
  return [s.店名, s.一押し, s.抜粋, s.料理メモ, s.ジャンル, s.エリア, s.住所, s.食通].filter(Boolean).join(" ").toLowerCase();
}
function distKm(a, b) {
  const R = 6371, toR = d => d * Math.PI / 180;
  const dLat = toR(b[0]-a[0]), dLng = toR(b[1]-a[1]);
  const x = Math.sin(dLat/2)**2 + Math.cos(toR(a[0]))*Math.cos(toR(b[0]))*Math.sin(dLng/2)**2;
  return 2 * R * Math.asin(Math.min(1, Math.sqrt(x)));
}
function visibleShops() {
  const q = state.q.trim().toLowerCase();
  let list = SHOPS.filter(s =>
    s.緯度 && s.経度 &&
    budgetOK(s.予算帯) &&
    (state.foodie === "all" || s.食通 === state.foodie) &&
    (state.genre === "all" || s.ジャンル === state.genre) &&
    (state.pref === "all" || s.都道府県 === state.pref) &&
    (!q || hay(s).includes(q))
  );
  if (state.nearby && state.near) {
    const here = state.near;
    list = list.map(s => ({ s, d: distKm(here, [s.緯度, s.経度]) }))
      .filter(x => x.d <= 30)
      .sort((a,b) => a.d - b.d)
      .map(x => x.s);
  }
  return list;
}
function markerIcon(band) {
  const c = COLORS[band] || "#a8a29e";
  return L.divIcon({
    className: "",
    html: `<div style="width:18px;height:18px;border-radius:50%;background:${c};border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)"></div>`,
    iconSize: [18, 18], iconAnchor: [9, 9], popupAnchor: [0, -10]
  });
}
function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
}
function popupHtml(s) {
  const star = s.複数推し ? `<div class="star">★複数推し</div>` : "";
  const oshi = s.一押し ? `<div class="oshi">一押し：${escapeHtml(s.一押し)}</div>` : "";
  const excerpt = s.抜粋 ? `<p class="memo">${escapeHtml(s.抜粋)}</p>` : (s.料理メモ ? `<p class="memo">${escapeHtml(s.料理メモ)}</p>` : "");
  return `<div class="pop">
    <h2>${escapeHtml(s.店名)}</h2>
    ${star}
    <div class="meta">${escapeHtml(s.食通)} ${escapeHtml(s.食通アカウント || "")}<br>${escapeHtml(s.ジャンル)} ／ ${escapeHtml(s.都道府県 || s.エリア)} ／ 予算：${escapeHtml(s.予算帯)}<br>${escapeHtml(s.住所)}</div>
    ${oshi}
    ${excerpt}
    <div class="btns">
      <a class="btn" href="${escapeHtml(s.SNS投稿URL)}" target="_blank" rel="noopener">元のツイートを見る</a>
      <a class="btn sub" href="${escapeHtml(s.GoogleマップURL)}" target="_blank" rel="noopener">Googleマップで開く</a>
    </div>
  </div>`;
}

const map = L.map("map", { zoomControl: true });
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19, attribution: "&copy; OpenStreetMap"
}).addTo(map);
const layer = L.layerGroup().addTo(map);
let meMarker = null;
let didFit = false;

function applyFilter() {
  layer.clearLayers();
  const vis = visibleShops();
  const bounds = [];
  vis.forEach(s => {
    const m = L.marker([s.緯度, s.経度], { icon: markerIcon(s.予算帯) });
    m.bindPopup(popupHtml(s), { maxWidth: 300 });
    m.addTo(layer);
    bounds.push([s.緯度, s.経度]);
  });
  let label = vis.length ? vis.length + "件表示中" : "条件に合う店がありません";
  if (state.nearby) label += "（現在地から約30km以内）";
  document.getElementById("count").textContent = label;
  if (state.nearby && state.near) {
    if (bounds.length) map.fitBounds(bounds, { padding: [40, 40], maxZoom: 13 });
    else map.setView(state.near, 12);
  } else if (bounds.length) {
    map.fitBounds(bounds, { padding: [30, 30], maxZoom: 11 });
    didFit = true;
  } else if (!didFit) {
    map.setView([36.4, 137.8], 5);
  }
}

document.getElementById("toggle").addEventListener("click", () => {
  const el = document.getElementById("filters");
  const on = !el.classList.contains("open");
  el.classList.toggle("open", on);
  document.getElementById("toggle").classList.toggle("on", on);
  setTimeout(() => map.invalidateSize(), 200);
});
document.getElementById("q").addEventListener("input", (e) => {
  state.q = e.target.value;
  applyFilter();
});
document.getElementById("near").addEventListener("click", () => {
  if (state.nearby) {
    state.nearby = false;
    document.getElementById("near").classList.remove("on");
    applyFilter();
    return;
  }
  if (!navigator.geolocation) {
    alert("このブラウザでは現在地が使えません");
    return;
  }
  navigator.geolocation.getCurrentPosition((pos) => {
    state.near = [pos.coords.latitude, pos.coords.longitude];
    state.nearby = true;
    document.getElementById("near").classList.add("on");
    if (meMarker) map.removeLayer(meMarker);
    meMarker = L.circleMarker(state.near, { radius: 7, color: "#fff", weight: 2, fillColor: "#2563eb", fillOpacity: 1 }).addTo(map);
    applyFilter();
  }, () => alert("現在地を取得できませんでした。位置情報の許可を確認してください。"), { enableHighAccuracy: true, timeout: 10000 });
});

renderFilterChips();
applyFilter();
setTimeout(() => map.invalidateSize(), 200);
window.addEventListener("resize", () => map.invalidateSize());

</script>
</body>
</html>
