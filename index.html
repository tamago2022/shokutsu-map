<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>食通グルメマップ（試作）</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
  :root {
    --bg: #1c1917;
    --panel: #292524;
    --ink: #fafaf9;
    --muted: #a8a29e;
    --accent: #ea580c;
    --accent2: #fbbf24;
    --chip: #44403c;
    --chip-on: #ea580c;
    --ok: #16a34a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif; background: var(--bg); color: var(--ink); }
  #app { display: flex; flex-direction: column; height: 100%; height: 100dvh; }
  header {
    flex: 0 0 auto;
    padding: 10px 14px 8px;
    background: var(--bg);
  }
  header h1 { margin: 0; font-size: 16px; font-weight: 700; letter-spacing: .02em; }
  header p { margin: 2px 0 0; font-size: 11px; color: var(--muted); }
  #count { color: var(--accent2); font-weight: 700; }
  #filters {
    flex: 0 0 auto;
    padding: 0 12px 8px;
    background: var(--bg);
    overflow-x: hidden;
  }
  .row { margin-top: 6px; }
  .label { font-size: 10px; color: var(--muted); margin-bottom: 4px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    appearance: none; border: 0; border-radius: 999px;
    background: var(--chip); color: var(--ink);
    font-size: 12px; padding: 6px 10px; line-height: 1.2;
    font-weight: 600;
  }
  .chip.on { background: var(--chip-on); color: #fff; }
  .chip.ghost.on { background: #57534e; }
  #map { flex: 1 1 auto; width: 100%; min-height: 200px; }
  .leaflet-popup-content-wrapper { border-radius: 12px; }
  .leaflet-popup-content { margin: 12px 14px; min-width: 200px; max-width: 260px; }
  .pop h2 { margin: 0 0 6px; font-size: 16px; line-height: 1.3; }
  .pop .meta { font-size: 12px; color: #444; margin: 0 0 6px; }
  .pop .memo { font-size: 13px; line-height: 1.5; margin: 0 0 10px; }
  .pop .btns { display: flex; flex-direction: column; gap: 6px; }
  .pop a.btn {
    display: block; text-align: center; text-decoration: none;
    background: #ea580c; color: #fff; border-radius: 8px;
    padding: 8px 10px; font-size: 13px; font-weight: 700;
  }
  .pop a.btn.sub { background: #1c1917; }
  .legend {
    position: absolute; right: 10px; bottom: 22px; z-index: 500;
    background: rgba(28,25,23,.9); color: #fff; font-size: 11px;
    padding: 6px 8px; border-radius: 8px; pointer-events: none;
  }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>食通グルメマップ（試作）</h1>
    <p>最初は <b>8,000円以内</b> の店だけ表示。<span id="count"></span></p>
  </header>
  <div id="filters">
    <div class="row">
      <div class="label">予算</div>
      <div class="chips" id="budget-chips"></div>
    </div>
    <div class="row">
      <div class="label">食通</div>
      <div class="chips" id="foodie-chips"></div>
    </div>
    <div class="row">
      <div class="label">ジャンル</div>
      <div class="chips" id="genre-chips"></div>
    </div>
    <div class="row">
      <div class="label">エリア</div>
      <div class="chips" id="area-chips"></div>
    </div>
  </div>
  <div id="map"></div>
</div>

const BUDGETS = [
  { id: "in8", label: "8000円以内", match: (b) => b === "〜5000円" || b === "5000〜8000円", defaultOn: true },
  { id: "low", label: "〜5000円", match: (b) => b === "〜5000円", defaultOn: false },
  { id: "mid", label: "5000〜8000円", match: (b) => b === "5000〜8000円", defaultOn: false },
  { id: "high", label: "8000円超", match: (b) => b === "8000円超", defaultOn: false },
  { id: "unk", label: "不明", match: (b) => b === "不明", defaultOn: false },
];

const COLORS = {
  "〜5000円": "#16a34a",
  "5000〜8000円": "#2563eb",
  "8000円超": "#a8a29e",
  "不明": "#a8a29e"
};

const state = {
  budgets: new Set(BUDGETS.filter(b => b.defaultOn).map(b => b.id)),
  foodie: "all",
  genre: "all",
  area: "all"
};

function unique(key) {
  return [...new Set(SHOPS.map(s => s[key]))].sort((a,b) => a.localeCompare(b, "ja"));
}

function makeChips(el, items, current, onPick) {
  el.innerHTML = "";
  items.forEach(item => {
    const btn = document.createElement("button");
    btn.className = "chip" + (item.on ? " on" : "");
    btn.type = "button";
    btn.textContent = item.label;
    btn.addEventListener("click", () => onPick(item.id));
    el.appendChild(btn);
  });
}

function renderFilterChips() {
  makeChips(document.getElementById("budget-chips"),
    BUDGETS.map(b => ({ id: b.id, label: b.label, on: state.budgets.has(b.id) })),
    null,
    (id) => {
      // 8000円以内 is a combo; toggling it sets low+mid and clears high/unk
      if (id === "in8") {
        if (state.budgets.has("in8") && state.budgets.size === 1) {
          // keep at least one
        } else if (state.budgets.has("in8")) {
          state.budgets.delete("in8");
        } else {
          state.budgets = new Set(["in8"]);
        }
      } else {
        state.budgets.delete("in8");
        if (state.budgets.has(id) && state.budgets.size === 1) {
          // keep
        } else if (state.budgets.has(id)) {
          state.budgets.delete(id);
        } else {
          state.budgets.add(id);
        }
        if (!state.budgets.size) state.budgets.add("in8");
      }
      renderFilterChips();
      applyFilter();
    }
  );

  const foodies = ["all", ...unique("食通")];
  makeChips(document.getElementById("foodie-chips"),
    foodies.map(v => ({ id: v, label: v === "all" ? "全員" : v, on: state.foodie === v })),
    state.foodie,
    (id) => { state.foodie = id; renderFilterChips(); applyFilter(); }
  );

  const genres = ["all", ...unique("ジャンル")];
  makeChips(document.getElementById("genre-chips"),
    genres.map(v => ({ id: v, label: v === "all" ? "すべて" : v, on: state.genre === v })),
    state.genre,
    (id) => { state.genre = id; renderFilterChips(); applyFilter(); }
  );

  const areas = ["all", ...unique("エリア")];
  makeChips(document.getElementById("area-chips"),
    areas.map(v => ({ id: v, label: v === "all" ? "すべて" : v, on: state.area === v })),
    state.area,
    (id) => { state.area = id; renderFilterChips(); applyFilter(); }
  );
}

function budgetOK(band) {
  const active = BUDGETS.filter(b => state.budgets.has(b.id));
  return active.some(b => b.match(band));
}

function visibleShops() {
  return SHOPS.filter(s =>
    s.緯度 && s.経度 &&
    budgetOK(s.予算帯) &&
    (state.foodie === "all" || s.食通 === state.foodie) &&
    (state.genre === "all" || s.ジャンル === state.genre) &&
    (state.area === "all" || s.エリア === state.area)
  );
}

function markerIcon(band) {
  const c = COLORS[band] || "#a8a29e";
  return L.divIcon({
    className: "",
    html: `<div style="width:18px;height:18px;border-radius:50%;background:${c};border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)"></div>`,
    iconSize: [18, 18],
    iconAnchor: [9, 9],
    popupAnchor: [0, -10]
  });
}

function popupHtml(s) {
  const memo = escapeHtml(s.料理メモ);
  const detail = s.予算詳細 ? `<div class="meta">${escapeHtml(s.予算詳細)}</div>` : "";
  return `<div class="pop">
    <h2>${escapeHtml(s.店名)}</h2>
    <div class="meta">${escapeHtml(s.食通)} ／ ${escapeHtml(s.ジャンル)} ／ ${escapeHtml(s.エリア)}<br>予算：${escapeHtml(s.予算帯)}<br>${escapeHtml(s.住所)}</div>
    ${detail}
    <p class="memo">${memo}</p>
    <div class="btns">
      <a class="btn" href="${escapeAttr(s.SNS投稿URL)}" target="_blank" rel="noopener">元のSNS投稿を見る</a>
      <a class="btn sub" href="${escapeAttr(s.GoogleマップURL)}" target="_blank" rel="noopener">Googleマップで開く</a>
    </div>
  </div>`;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
}
function escapeAttr(s) { return escapeHtml(s); }

const map = L.map("map", { zoomControl: true, attributionControl: true });
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19,
  attribution: "&copy; OpenStreetMap"
}).addTo(map);

const layer = L.layerGroup().addTo(map);
let didFit = false;

function applyFilter() {
  layer.clearLayers();
  const vis = visibleShops();
  const bounds = [];
  vis.forEach(s => {
    const m = L.marker([s.緯度, s.経度], { icon: markerIcon(s.予算帯) });
    m.bindPopup(popupHtml(s), { maxWidth: 280 });
    m.addTo(layer);
    bounds.push([s.緯度, s.経度]);
  });
  document.getElementById("count").textContent = vis.length ? `${vis.length}件表示中` : "条件に合う店がありません";
  if (bounds.length) {
    map.fitBounds(bounds, { padding: [40, 40], maxZoom: 12 });
    didFit = true;
  } else if (!didFit) {
    map.setView([35.68, 139.76], 5);
  }
}

renderFilterChips();
applyFilter();
setTimeout(() => map.invalidateSize(), 200);
window.addEventListener("resize", () => map.invalidateSize());
</script>
</body>
